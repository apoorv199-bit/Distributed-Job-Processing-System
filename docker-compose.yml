services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: jobprocessor
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d jobprocessor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes # persist to disk
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      DATABASE_URL: postgres://app:secret@postgres:5432/jobprocessor?sslmode=disable
      REDIS_URL: redis:6379
      API_KEY: apoorvsahu123456
      API_KEYS: "service-a:key-a,service-b:key-b"
      WORKER_ID: docker-worker-1
      WORKER_CONCURRENCY: 10
      RATE_LIMIT_DEFAULT: 100
      RATE_LIMIT_QUEUES_CRITICAL: 200
      RATE_LIMIT_QUEUES_DEFAULT: 100
      RATE_LIMIT_QUEUES_BATCH: 20
      RATE_LIMIT_JOB_TYPES_GENERATE_REPORT: 5
      RATE_LIMIT_JOB_TYPES_SEND_EMAIL: 50
      VISIBILITY_TIMEOUT_MINUTES: 10
      SCHEDULER_POLL_INTERVAL_SECONDS: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
