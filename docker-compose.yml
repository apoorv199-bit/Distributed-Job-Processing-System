services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: jobprocessor
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d jobprocessor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes # persist to disk
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      DATABASE_URL: postgres://app:secret@postgres:5432/jobprocessor?sslmode=disable
      REDIS_URL: redis:6379
      API_KEY: apoorvsahu123456
      WORKER_ID: docker-worker-1
      WORKER_CONCURRENCY: 10
      RATE_LIMIT_DEFAULT: 100
      RATE_LIMIT_QUEUES_CRITICAL: 200
      RATE_LIMIT_QUEUES_DEFAULT: 100
      RATE_LIMIT_QUEUES_BATCH: 20
      RATE_LIMIT_JOB_TYPES_GENERATE_REPORT: 5
      RATE_LIMIT_JOB_TYPES_SEND_EMAIL: 50
      VISIBILITY_TIMEOUT_MINUTES: 10
      SCHEDULER_POLL_INTERVAL_SECONDS: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deployments/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Disable the "change password" prompt on first login
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      # Provisioning — auto-loads datasource + dashboard on startup
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning
      # Dashboard JSON files
      - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards
      # Persist Grafana state (annotations, saved queries, etc.)
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  grafana_data:
